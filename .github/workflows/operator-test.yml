name: Operator Tests

on:
  push:
    paths:
      - 'operator/**'
  pull_request:
    paths:
      - 'operator/**'

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod

      - name: Running Tests
        working-directory: operator
        run: |
          go mod tidy
          make test
