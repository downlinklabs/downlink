name: Runner Release

on:
  push:
    tags:
      - "runner-v*.*.*"
  workflow_dispatch:

jobs:
  build-push:
    name: Build and push runner image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: playwright-runner/Dockerfile
          push: true
          tags: |
            ghcr.io/downlinklabs/playwright-runner:${{ github.ref_name }}
            ghcr.io/downlinklabs/playwright-runner:latest
          platforms: linux/amd64
